# Supabase CLI 로컬 설정 (최소). `pnpm supabase start` 시 사용.
project_id = "osle-select"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 500

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = false            # 초대·승인 기반. 공개 가입 없음

[auth.email]
enable_signup = false
otp_length = 6
otp_expiry = 600                 # 10분
double_confirm_changes = true
enable_confirmations = false

[auth.external.kakao]
enabled = true
client_id = "env(KAKAO_CLIENT_ID)"
secret = "env(KAKAO_CLIENT_SECRET)"
redirect_uri = ""

[storage]
# 전역 상한이 버킷 상한을 덮는다 — exports 버킷(50MiB)에 맞춘다. 운영 Dashboard도 같은 값으로. (r8 리뷰 MED-2)
file_size_limit = "50MiB"

# 버킷: 모두 비공개(PRD 6장). 서명 URL만. 로컬 `supabase start`가 만든다 — 운영은 Dashboard에서 같은 설정으로.
# 클라이언트가 2000px WebP 0.85로 줄여 올리므로 webp만, 5MiB 상한.
[storage.buckets.request-images]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp"]

[storage.buckets.product-images]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp"]

[storage.buckets.vendor-cards]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp"]

[storage.buckets.sample-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp"]

[storage.buckets.inspection-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/webp"]

[storage.buckets.exports]
public = false
file_size_limit = "50MiB"
